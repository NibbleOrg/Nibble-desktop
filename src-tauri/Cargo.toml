[package]
name = "nibble-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
default-run = "nibble-desktop"

[lib]
name = "nibble_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-global-shortcut = "=2.4.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.28", features = ["derive", "function"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["typescript"] }

[features]
native-probe = []

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.5" }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "libc", "NSAccessibility", "NSWindow", "NSResponder", "NSWorkspace", "NSRunningApplication"] }

objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSCalendar", "NSLocale", "NSString"] }

[dev-dependencies]
global-hotkey = "=0.8.0"

[patch.crates-io]
global-hotkey = { path = "vendor/global-hotkey" }
