<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nibble Workbench — Dark Shell Prototype</title>
  <style>
    /*
      PROTOTYPE ONLY. Three structurally different Workbench directions,
      switchable with ?variant=A|B|C. This is decision material, not production code.
    */
    :root {
      color-scheme: dark;
      --motion: 200ms;
      --ease: cubic-bezier(.2, .82, .2, 1);
      --quick-ink: #20211d;
      --quick-muted: #6d6e67;
      --quick-line: rgba(48, 48, 43, .12);
      --quick-paper: rgba(255, 253, 248, .83);
      --quick-accent: #d4613d;
      font-family: "Avenir Next", "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #090b0a;
    }

    button, input {
      color: inherit;
      font: inherit;
    }

    button { cursor: pointer; }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid rgba(232, 137, 91, .9);
      outline-offset: 2px;
    }

    button, input, .route-view, .cal-grid {
      -webkit-user-select: none;
      user-select: none;
    }

    .prototype-window {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .workbench {
      position: absolute;
      inset: 0;
      display: flex;
      min-width: 0;
      min-height: 0;
      background: #101210;
      color: #edede7;
      transition: opacity var(--motion) ease;
    }

    .workbench.is-launching {
      animation: shell-in calc(var(--motion) * .8) var(--ease) both;
    }

    @keyframes shell-in {
      from { opacity: 0; transform: scale(.994); }
      to { opacity: 1; transform: scale(1); }
    }

    .icon {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.55;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-button {
      border: 0;
      background: transparent;
    }

    .window-controls {
      display: flex;
      flex: 0 0 auto;
      gap: 7px;
      align-items: center;
      min-width: 55px;
    }

    .window-controls span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #343832;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .055);
    }

    .window-controls span:first-child { background: #6e3e35; }
    .window-controls span:nth-child(2) { background: #665b36; }
    .window-controls span:nth-child(3) { background: #355a43; }

    .route-view {
      min-width: 0;
      min-height: 0;
      transition:
        opacity calc(var(--motion) * .62) ease,
        transform var(--motion) var(--ease);
    }

    .route-view.is-leaving {
      opacity: 0;
      transform: translateY(5px);
    }

    .route-view.is-entering {
      animation: route-in calc(var(--motion) * .8) var(--ease) both;
    }

    @keyframes route-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Variant A — Ink rail */
    .va {
      --rail: #0b0d0c;
      --canvas: #111311;
      --surface: #171a18;
      --surface-raised: #1b1e1b;
      --line: rgba(240, 239, 229, .085);
      --line-strong: rgba(240, 239, 229, .15);
      --ink: #eeeee8;
      --muted: #888c83;
      --subtle: #5f645d;
      --accent: #e17c51;
      --accent-soft: rgba(225, 124, 81, .13);
      --grid-line: rgba(237, 235, 225, .065);
      background: var(--canvas);
    }

    .va-rail {
      display: flex;
      flex: 0 0 76px;
      flex-direction: column;
      align-items: center;
      padding: 18px 9px 15px;
      border-right: 1px solid rgba(255, 255, 255, .055);
      background: var(--rail);
    }

    .va-logo {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      margin: 2px 0 27px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 11px;
      color: #17120f;
      background: #e58258;
      box-shadow: 0 7px 22px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .35);
      font-family: Georgia, "Songti SC", serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.08em;
    }

    .va-nav {
      display: grid;
      gap: 7px;
      width: 100%;
    }

    .va-nav-button {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      height: 50px;
      border-radius: 11px;
      color: #686d66;
      transition: color 140ms ease, background 140ms ease;
    }

    .va-nav-button:hover {
      color: #c5c7bf;
      background: rgba(255, 255, 255, .035);
    }

    .va-nav-button.is-active {
      color: #f0a27f;
      background: var(--accent-soft);
    }

    .va-nav-button.is-active::before {
      position: absolute;
      top: 15px;
      bottom: 15px;
      left: -9px;
      width: 2px;
      border-radius: 0 3px 3px 0;
      background: var(--accent);
      content: "";
    }

    .va-nav-button .icon {
      width: 19px;
      height: 19px;
    }

    .va-rail-spacer { flex: 1; }

    .va-main {
      display: flex;
      flex: 1;
      min-width: 0;
      flex-direction: column;
    }

    .va-topbar {
      display: flex;
      flex: 0 0 58px;
      gap: 18px;
      align-items: center;
      padding: 0 28px;
      border-bottom: 1px solid rgba(255, 255, 255, .055);
      color: #7e8279;
      font-size: 11px;
    }

    .va-topbar strong {
      color: #d4d5cd;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .01em;
    }

    .va-topbar-divider {
      width: 1px;
      height: 13px;
      background: rgba(255, 255, 255, .09);
    }

    .va-topbar-spacer { flex: 1; }

    .va-topbar-meta {
      display: flex;
      gap: 7px;
      align-items: center;
      color: #666b64;
    }

    .va-topbar-meta::before {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #708a73;
      box-shadow: 0 0 0 3px rgba(112, 138, 115, .08);
      content: "";
    }

    .va-home {
      display: grid;
      flex: 1;
      min-width: 0;
      min-height: 0;
      place-items: center;
      overflow: auto;
      padding: 34px clamp(24px, 5vw, 78px) 42px;
      background:
        radial-gradient(circle at 51% 38%, rgba(230, 126, 80, .035), transparent 36%),
        linear-gradient(rgba(255, 255, 255, .013) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .013) 1px, transparent 1px);
      background-size: auto, 36px 36px, 36px 36px;
    }

    .va-home > [data-route-view],
    .vb-home > [data-route-view],
    .vc-home > [data-route-view] {
      width: 100%;
    }

    .va-home > [data-route-view] {
      display: flex;
      justify-content: center;
    }

    .vb-home > [data-route-view],
    .vc-home > [data-route-view] {
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: center;
    }

    .va-calendar {
      display: flex;
      width: min(100%, 1060px);
      height: clamp(430px, calc(100vh - 178px), 660px);
      min-height: 430px;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--surface);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, .20),
        inset 0 1px 0 rgba(255, 255, 255, .025);
    }

    .cal-head {
      display: flex;
      flex: 0 0 auto;
      gap: 18px;
      align-items: center;
      justify-content: space-between;
      min-height: 92px;
      padding: 20px 24px 18px 27px;
      border-bottom: 1px solid var(--line);
    }

    .cal-title-block {
      min-width: 0;
    }

    .cal-eyebrow {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .145em;
      text-transform: uppercase;
    }

    .cal-eyebrow::before {
      width: 18px;
      height: 1px;
      background: var(--accent);
      content: "";
    }

    .cal-title {
      margin: 0;
      color: var(--ink);
      font-size: clamp(22px, 2.2vw, 29px);
      font-weight: 560;
      letter-spacing: -.035em;
      line-height: 1.15;
    }

    .cal-controls {
      display: flex;
      flex: 0 0 auto;
      gap: 7px;
      align-items: center;
    }

    .cal-control {
      display: inline-grid;
      place-items: center;
      min-width: 32px;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255, 255, 255, .018);
      transition: color 130ms ease, border-color 130ms ease, background 130ms ease;
    }

    .cal-control:hover {
      color: var(--ink);
      border-color: var(--line-strong);
      background: rgba(255, 255, 255, .04);
    }

    .cal-control.today {
      padding: 0 12px;
      color: var(--ink);
      font-size: 10px;
    }

    .cal-control .icon {
      width: 15px;
      height: 15px;
    }

    .cal-weekdays {
      display: grid;
      flex: 0 0 33px;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      padding: 0 16px;
      border-bottom: 1px solid var(--grid-line);
      color: var(--subtle);
      font-size: 9px;
      font-weight: 650;
      letter-spacing: .09em;
    }

    .cal-weekdays span {
      display: grid;
      place-items: center;
    }

    .cal-grid {
      position: relative;
      display: grid;
      flex: 1;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      grid-template-rows: repeat(6, minmax(0, 1fr));
      min-height: 0;
      padding: 0 16px 12px;
      transition: opacity calc(var(--motion) * .52) ease, transform var(--motion) var(--ease);
    }

    .cal-grid.is-out-next { opacity: 0; transform: translateX(-9px); }
    .cal-grid.is-out-prev { opacity: 0; transform: translateX(9px); }

    .day-cell {
      position: relative;
      display: flex;
      min-width: 0;
      min-height: 0;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 10px 11px;
      border-right: 1px solid var(--grid-line);
      border-bottom: 1px solid var(--grid-line);
      color: #c0c2ba;
      background: transparent;
      transition: background 100ms ease;
    }

    .day-cell:nth-child(7n) { border-right: 0; }
    .day-cell:nth-last-child(-n + 7) { border-bottom: 0; }

    .day-cell:hover { background: rgba(255, 255, 255, .024); }

    .day-cell.is-adjacent { color: #4f554e; }
    .day-cell.is-weekend { color: #999d94; }
    .day-cell.is-adjacent.is-weekend { color: #484d47; }

    .day-number {
      display: grid;
      place-items: center;
      min-width: 27px;
      height: 27px;
      padding: 0 4px;
      border-radius: 8px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      transition: color 120ms ease, background 120ms ease;
    }

    .day-cell.is-today .day-number {
      color: #1b120e;
      background: #df825b;
      font-weight: 750;
      box-shadow: 0 5px 15px rgba(223, 130, 91, .15);
    }

    .day-cell.is-today::after {
      position: absolute;
      right: 13px;
      bottom: 10px;
      left: 13px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(223, 130, 91, .30), transparent);
      content: "";
    }

    .cal-footer {
      display: flex;
      flex: 0 0 43px;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 9px;
    }

    .cal-footer-today {
      color: #a7aaa1;
      font-variant-numeric: tabular-nums;
    }

    .empty-note {
      display: none;
      color: #a8aaa1;
    }

    .calendar.is-empty .empty-note { display: inline; }

    /* Variant B — Editorial ledger */
    .vb {
      --sidebar: #0c0e0d;
      --canvas: #151714;
      --surface: #171a17;
      --line: rgba(236, 233, 219, .10);
      --line-strong: rgba(236, 233, 219, .18);
      --ink: #f1eee5;
      --muted: #92958c;
      --subtle: #64685f;
      --accent: #c96b48;
      --grid-line: rgba(237, 231, 215, .075);
      background: var(--canvas);
    }

    .vb-sidebar {
      display: flex;
      flex: 0 0 236px;
      flex-direction: column;
      padding: 26px 19px 20px;
      border-right: 1px solid rgba(255, 255, 255, .06);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .014), transparent 28%),
        var(--sidebar);
    }

    .vb-brand {
      display: flex;
      gap: 11px;
      align-items: center;
      padding: 4px 8px 25px;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
    }

    .vb-mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      color: #1e1510;
      background: #d67a54;
      font-family: Georgia, serif;
      font-size: 16px;
      font-weight: 700;
    }

    .vb-brand-copy strong {
      display: block;
      color: #e8e4da;
      font-family: Georgia, "Songti SC", serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -.015em;
    }

    .vb-brand-copy span {
      display: block;
      margin-top: 2px;
      color: #62665e;
      font-size: 8px;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .vb-nav {
      display: grid;
      gap: 5px;
      padding: 22px 0;
    }

    .vb-nav-label {
      margin: 0 10px 8px;
      color: #555a53;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .vb-nav-button {
      position: relative;
      display: flex;
      gap: 11px;
      align-items: center;
      height: 39px;
      padding: 0 11px;
      border: 1px solid transparent;
      border-radius: 9px;
      color: #858980;
      text-align: left;
      font-size: 12px;
      transition: color 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    .vb-nav-button:hover {
      color: #d3d1c8;
      background: rgba(255, 255, 255, .025);
    }

    .vb-nav-button.is-active {
      color: #f0eae0;
      border-color: rgba(211, 111, 74, .15);
      background: rgba(211, 111, 74, .085);
    }

    .vb-nav-button.is-active::after {
      position: absolute;
      top: 12px;
      right: -19px;
      bottom: 12px;
      width: 2px;
      background: var(--accent);
      content: "";
    }

    .vb-nav-button .icon {
      width: 16px;
      height: 16px;
    }

    .vb-sidebar-spacer { flex: 1; }

    .vb-main {
      display: flex;
      flex: 1;
      min-width: 0;
      flex-direction: column;
    }

    .vb-topbar {
      display: flex;
      flex: 0 0 61px;
      gap: 16px;
      align-items: center;
      padding: 0 31px;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
    }

    .vb-breadcrumb {
      color: #6d7169;
      font-family: Georgia, "Songti SC", serif;
      font-size: 12px;
    }

    .vb-breadcrumb strong {
      color: #d5d2c9;
      font-weight: 500;
    }

    .vb-topbar-spacer { flex: 1; }

    .vb-home {
      display: flex;
      flex: 1;
      min-width: 0;
      min-height: 0;
      align-items: stretch;
      justify-content: center;
      overflow: auto;
      padding: clamp(24px, 4.5vw, 64px);
      background:
        linear-gradient(90deg, rgba(255, 255, 255, .018) 1px, transparent 1px);
      background-size: 92px 100%;
    }

    .vb-calendar {
      display: grid;
      width: min(100%, 1120px);
      height: clamp(450px, calc(100vh - 174px), 690px);
      min-height: 450px;
      grid-template-rows: auto auto 1fr auto;
      overflow: hidden;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .018), transparent 20%),
        var(--surface);
      box-shadow: 0 34px 90px rgba(0, 0, 0, .2);
    }

    .vb-calendar .cal-head {
      min-height: 116px;
      padding: 22px 26px 19px 30px;
      border-bottom-color: var(--line-strong);
    }

    .vb-calendar .cal-eyebrow {
      font-family: Georgia, "Songti SC", serif;
      font-size: 9px;
      font-style: italic;
      letter-spacing: .06em;
      text-transform: none;
    }

    .vb-calendar .cal-title {
      font-family: Georgia, "Songti SC", serif;
      font-size: clamp(29px, 3vw, 42px);
      font-weight: 400;
      letter-spacing: -.045em;
    }

    .vb-calendar .cal-control {
      height: 34px;
      border-radius: 5px;
      background: rgba(255, 255, 255, .012);
    }

    .vb-calendar .cal-weekdays {
      flex-basis: 39px;
      padding: 0 22px;
      font-family: Georgia, "Songti SC", serif;
      font-size: 9px;
      font-style: italic;
      letter-spacing: .03em;
    }

    .vb-calendar .cal-grid {
      padding: 0 22px 18px;
    }

    .vb-calendar .day-cell {
      padding: 13px 14px;
    }

    .vb-calendar .day-number {
      min-width: 30px;
      height: 30px;
      border-radius: 3px;
      font-family: Georgia, "Songti SC", serif;
      font-size: 12px;
    }

    .vb-calendar .day-cell.is-today .day-number {
      border-radius: 50%;
    }

    .vb-calendar .cal-footer {
      flex-basis: 48px;
      padding: 0 30px;
      font-family: Georgia, "Songti SC", serif;
      font-style: italic;
    }

    /* Variant C — Command shelf */
    .vc {
      --rail: #0c0e0c;
      --canvas: #0f1210;
      --surface: #191c19;
      --line: rgba(242, 238, 226, .12);
      --line-strong: rgba(242, 238, 226, .22);
      --ink: #f0eee7;
      --muted: #96998f;
      --subtle: #686d65;
      --accent: #e18055;
      --grid-line: rgba(241, 238, 227, .075);
      flex-direction: column;
      background:
        radial-gradient(circle at 51% 48%, rgba(225, 128, 85, .05), transparent 34%),
        var(--canvas);
    }

    .vc-topbar {
      display: flex;
      flex: 0 0 62px;
      gap: 18px;
      align-items: center;
      padding: 0 17px 0 20px;
      border-bottom: 1px solid rgba(255, 255, 255, .065);
      background: rgba(10, 12, 10, .82);
      backdrop-filter: blur(18px);
    }

    .vc-brand {
      display: flex;
      gap: 10px;
      align-items: center;
      min-width: 114px;
    }

    .vc-brand-mark {
      display: grid;
      place-items: center;
      width: 27px;
      height: 27px;
      border: 1px solid rgba(225, 128, 85, .35);
      border-radius: 8px;
      color: #f3b18f;
      background: rgba(225, 128, 85, .09);
      font-family: Georgia, serif;
      font-size: 14px;
      font-weight: 700;
    }

    .vc-brand strong {
      color: #deddd5;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .01em;
    }

    .vc-nav {
      display: flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid rgba(255, 255, 255, .055);
      border-radius: 10px;
      background: rgba(255, 255, 255, .02);
    }

    .vc-nav-button {
      display: flex;
      gap: 7px;
      align-items: center;
      height: 30px;
      padding: 0 11px;
      border-radius: 7px;
      color: #70756d;
      font-size: 10px;
      transition: color 140ms ease, background 140ms ease;
    }

    .vc-nav-button:hover { color: #cbc9c1; }
    .vc-nav-button.is-active {
      color: #eee8df;
      background: rgba(255, 255, 255, .07);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05);
    }

    .vc-nav-button .icon {
      width: 14px;
      height: 14px;
    }

    .vc-topbar-spacer { flex: 1; }

    .vc-page-context {
      color: #666b63;
      font-size: 9px;
      letter-spacing: .04em;
    }

    .vc-body {
      display: flex;
      flex: 1;
      min-height: 0;
      min-width: 0;
    }

    .vc-rail {
      display: flex;
      flex: 0 0 58px;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      padding: 15px 8px 13px;
      border-right: 1px solid rgba(255, 255, 255, .055);
      background: rgba(9, 11, 9, .62);
    }

    .vc-rail-chip {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: #555a53;
    }

    .vc-rail-chip:hover {
      color: #b6b7af;
      background: rgba(255, 255, 255, .025);
    }

    .vc-rail-chip.is-accent {
      color: #e4a489;
      border-color: rgba(225, 128, 85, .16);
      background: rgba(225, 128, 85, .07);
    }

    .vc-rail-spacer { flex: 1; }

    .vc-rail-date {
      color: #555a53;
      font-family: "SFMono-Regular", Menlo, monospace;
      font-size: 8px;
      letter-spacing: .04em;
      writing-mode: vertical-rl;
    }

    .vc-home {
      display: grid;
      flex: 1;

    /* Accepted white Quick Panel, used as a relationship reference over Workbench. */
    .quick-overlay {

      inset: 0;
      display: grid;
      place-items: start center;
      padding-top: clamp(52px, 9vh, 88px);

    }

    .quick-overlay.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .quick-panel {
      position: relative;
      display: flex;
      width: min(650px, calc(100vw - 48px));
      height: 264px;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .78);

        radial-gradient(circle at 17% 0%, rgba(255, 255, 255, .52), transparent 30%),

        linear-gradient(145deg, rgba(255, 255, 255, .79), rgba(243, 239, 230, .69));
      box-shadow:
        0 32px 96px rgba(2, 4, 3, .46),

      transition:
        transform var(--motion) var(--ease),
        opacity calc(var(--motion) * .7) ease;
      backdrop-filter: blur(30px) saturate(168%);

    .quick-overlay.is-open .quick-panel {

    .quick-panel::before {
      position: absolute;

    .quick-brand {

    .quick-search {

      align-items: center;
      min-height: 46px;
      margin: 6px 14px;

    .quick-search span {
      color: #a04f35;

    }

    .quick-search input {

      border: 0;
      outline: 0;

    .quick-key {

      gap: 9px;

    .quick-tool em {

    .quick-footer {

      .vc-brand { min-width: auto; }
      .vc-home { padding: 15px 15px 58px; }
      .vc-calendar { height: calc(100vh - 174px); min-height: 390px; }
      .cal-head { min-height: 76px; padding: 14px 15px; }

      .settings-view { grid-template-columns: 1fr; padding: 28px; }

      .settings-sheet { padding: 26px 0 0; }
      .prototype-lab { right: 14px; width: min(245px, calc(100vw - 28px)); }

    @media (max-width: 560px) {
      .vc-topbar { gap: 8px; padding-inline: 10px; }
      .vc-brand { display: none; }
      .vc-rail { flex-basis: 50px; padding-inline: 5px; }
      .vc-rail-chip { width: 36px; }
      .va-topbar-meta, .vb-breadcrumb span { display: none; }
      .va-topbar { padding-inline: 14px; }
      .va-home, .vb-home, .vc-home { padding: 10px 10px 55px; }
      .va-calendar, .vb-calendar, .vc-calendar {
        height: calc(100vh - 110px);
        min-height: 400px;
        border-radius: 10px;
      }
      .cal-head { align-items: flex-start; flex-direction: column; gap: 10px; }

      .day-cell { padding: 6px 4px; justify-content: center; }
      .day-cell.is-today::after { display: none; }
      .day-number { min-width: 24px; height: 24px; padding: 0; font-size: 9px; }
      .quick-overlay { padding-top: 28px; }
      .quick-panel { width: calc(100vw - 24px); }
    }

    body[data-motion="reduce"] *,
    body[data-motion="reduce"] *::before,
    body[data-motion="reduce"] *::after {
      scroll-behavior: auto !important;
      animation-duration: 1ms !important;
      animation-delay: 0ms !important;
      transition-duration: 1ms !important;
      transition-delay: 0ms !important;
    }

    @media (prefers-reduced-motion: reduce) {
      :root { --motion: 1ms; }
    }
  </style>
</head>

    const icons = {
      home: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.8 12 4l8 6.8v8.1a1.1 1.1 0 0 1-1.1 1.1H5.1A1.1 1.1 0 0 1 4 18.9z"/><path d="M9 20v-6h6v6"/></svg>',
      settings: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.1"/><path d="M19.2 13.7a7.9 7.9 0 0 0 0-3.4l1.6-1.2-1.9-3.2-1.9.8a8 8 0 0 0-2.9-1.7L13.8 3h-3.6L9.8 5a8 8 0 0 0-2.9 1.7l-1.9-.8-1.9 3.2 1.6 1.2a7.9 7.9 0 0 0 0 3.4L3 14.9l1.9 3.2 1.9-.8a8 8 0 0 0 2.9 1.7l.4 2h3.6l.4-2a8 8 0 0 0 2.9-1.7l1.9.8 1.9-3.2z"/></svg>',
      left: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>',
      right: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>',
      calendar: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M7.5 3v4M16.5 3v4M3.5 9.5h17"/></svg>',
      search: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.7" cy="10.7" r="6.2"/><path d="m15.2 15.2 4.3 4.3"/></svg>',
      grid: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>'
    };

    const state = {
      variant: "A",
      route: "home",
      month: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
      empty: false,
      reduced: false,
      motion: 200
    };

    const stage = document.querySelector("#stage");
    const lab = document.querySelector("#lab");
    const quickOverlay = document.querySelector("#quick-overlay");
    const params = new URLSearchParams(location.search);
    state.variant = ["A", "B", "C"].includes(params.get("variant")) ? params.get("variant") : "A";
    state.reduced = params.get("motion") === "reduce" ||
      (window.matchMedia("(prefers-reduced-motion: reduce)").matches && params.get("motion") !== "full");

    function navButton(kind, route, label, icon) {
      return `
        <button class="${kind}-button nav-button ${state.route === route ? "is-active" : ""}" data-route="${route}" aria-current="${state.route === route ? "page" : "false"}">
          ${icon}<span>${label}</span>
        </button>`;
    }

    function settingsMarkup(kind) {
      return `
        <div class="settings-view" data-route-view>
          <aside class="settings-index">
            <span>Settings</span>
            <strong>设置</strong>
            <p>应用级设置同时服务 Workbench 与 Quick Panel。此页仅用于演示外壳导航，具体配置项另行设计。</p>
          </aside>
          <section class="settings-sheet">
            <small>${kind === "vb" ? "Application ledger" : "Nibble settings"}</small>
            <h2>日期与语言</h2>
            <p>月历跟随系统的日期、语言与每周首日。这里刻意只展示稳定、已确定的应用级信息。</p>
            <div class="settings-row">
              <div><strong>日历日期</strong><span>系统本地日期与语言</span></div>
              <span class="settings-value">自动</span>
            </div>
            <div class="settings-row">
              <div><strong>每周首日</strong><span>由当前系统区域设置决定</span></div>
              <span class="settings-value">系统</span>
            </div>
            <div class="settings-row">
              <div><strong>Quick Panel 快捷键</strong><span>全局唤起与设置入口</span></div>
              <span class="settings-value">⌥Space</span>
            </div>
          </section>
        </div>`;
    }

    function calendarMarkup(kind) {
      return `
        <section class="calendar ${kind}-calendar ${state.empty ? "is-empty" : ""}" aria-label="月历">
          <header class="cal-head">
            <div class="cal-title-block">
              <div class="cal-eyebrow">Workbench · Calendar</div>
              <h1 class="cal-title" data-month-label></h1>
            </div>
            <div class="cal-controls" aria-label="月历导航">
              <button class="cal-control nav-button" data-month-move="-1" aria-label="上个月">${icons.left}</button>
              <button class="cal-control today nav-button" data-month-today>今天</button>
              <button class="cal-control nav-button" data-month-move="1" aria-label="下个月">${icons.right}</button>
            </div>
          </header>
          <div class="cal-weekdays" data-weekdays></div>
          <div class="cal-grid" data-calendar-grid tabindex="0" aria-label="月历日期"></div>
          <footer class="cal-footer">
            <span class="cal-footer-today" data-today-label></span>
            <span class="empty-note">本月暂无日历事件</span>
            <span>本地日期 · 只读月历</span>
          </footer>
        </section>`;
    }

    function homeMarkup(kind) {
      if (kind === "va") return `<main class="va-home"><div data-route-view>${calendarMarkup(kind)}</div></main>`;
      if (kind === "vb") return `<main class="vb-home"><div data-route-view>${calendarMarkup(kind)}</div></main>`;
      return `<main class="vc-home"><div data-route-view>${calendarMarkup(kind)}</div></main>`;
    }

    function renderShell() {
      if (state.variant === "A") {
        return `
          <div class="workbench va is-launching">
            <aside class="va-rail">
              <div class="va-logo" aria-label="Nibble">N</div>
              <nav class="va-nav">${navButton("va-nav", "home", "首页", icons.home)}</nav>
              <div class="va-rail-spacer"></div>
              <nav class="va-nav">${navButton("va-nav", "settings", "设置", icons.settings)}</nav>
            </aside>
            <section class="va-main">
              <header class="va-topbar">
                <div class="window-controls" aria-hidden="true"><span></span><span></span><span></span></div>
                <strong>Nibble</strong>
                <span class="va-topbar-divider"></span>
                <span data-route-title>${state.route === "home" ? "首页" : "设置"}</span>
                <span class="va-topbar-spacer"></span>
                <span class="va-topbar-meta">本地运行</span>
              </header>
              ${state.route === "home" ? homeMarkup("va") : `<div class="va-main" data-route-view>${settingsMarkup("va")}</div>`}
            </section>
          </div>`;
      }

      if (state.variant === "B") {
        return `
          <div class="workbench vb is-launching">
            <aside class="vb-sidebar">
              <div class="vb-brand">
                <div class="vb-mark">N</div>
                <div class="vb-brand-copy"><strong>Nibble</strong><span>Workbench</span></div>
              </div>
              <nav class="vb-nav">
                <div class="vb-nav-label">Workspace</div>
                ${navButton("vb-nav", "home", "首页", icons.home)}
              </nav>
              <div class="vb-sidebar-spacer"></div>
              <nav class="vb-nav">${navButton("vb-nav", "settings", "设置", icons.settings)}</nav>
            </aside>
            <section class="vb-main">
              <header class="vb-topbar">
                <div class="vb-breadcrumb"><span>Nibble / </span><strong>${state.route === "home" ? "首页" : "设置"}</strong></div>
                <span class="vb-topbar-spacer"></span>
              </header>
              ${state.route === "home" ? homeMarkup("vb") : `<div class="vb-main" data-route-view>${settingsMarkup("vb")}</div>`}
            </section>
          </div>`;
      }

      return `
        <div class="workbench vc is-launching">
          <header class="vc-topbar">
            <div class="vc-brand"><span class="vc-brand-mark">N</span><strong>Nibble</strong></div>
            <span class="vc-page-context">${state.route === "home" ? "首页 / Calendar" : "设置"}</span>
            <span class="vc-topbar-spacer"></span>
          </header>
          <div class="vc-body">
            <aside class="vc-rail">
              <button class="vc-rail-chip nav-button ${state.route === "home" ? "is-accent" : ""}" data-route="home" aria-label="首页">${icons.calendar}</button>
              <span class="vc-rail-date">LOCAL · MONTH</span>
              <div class="vc-rail-spacer"></div>
              <button class="vc-rail-chip nav-button ${state.route === "settings" ? "is-accent" : ""}" data-route="settings" aria-label="设置">${icons.settings}</button>
            </aside>
            ${state.route === "home" ? homeMarkup("vc") : `<main class="vc-home"><div data-route-view>${settingsMarkup("vc")}</div></main>`}
          </div>
        </div>`;
    }

    function localeInfo() {
      const locale = navigator.language || "zh-CN";
      let firstDay = 1;
      try {
        firstDay = new Intl.Locale(locale).weekInfo?.firstDay ?? 1;
      } catch (_) {}
      return { locale, firstDay: firstDay % 7 };
    }

    function renderCalendar() {
      const { locale, firstDay } = localeInfo();
      const monthLabel = new Intl.DateTimeFormat(locale, { year: "numeric", month: "long" }).format(state.month);
      document.querySelectorAll("[data-month-label]").forEach(node => node.textContent = monthLabel);

      const weekdayFormatter = new Intl.DateTimeFormat(locale, { weekday: "short" });
      const weekdayNodes = document.querySelectorAll("[data-weekdays]");
      weekdayNodes.forEach(node => {
        node.innerHTML = Array.from({ length: 7 }, (_, index) =>
          `<span>${weekdayFormatter.format(new Date(2024, 0, 7 + firstDay + index))}</span>`
        ).join("");
      });

      const monthStart = new Date(state.month.getFullYear(), state.month.getMonth(), 1);
      const offset = (monthStart.getDay() - firstDay + 7) % 7;
      const gridStart = new Date(monthStart);
      gridStart.setDate(1 - offset);
      const today = new Date();
      const todayKey = `${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`;

      document.querySelectorAll("[data-calendar-grid]").forEach(grid => {
        grid.innerHTML = Array.from({ length: 42 }, (_, index) => {
          const date = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + index);
          const adjacent = date.getMonth() !== state.month.getMonth();
          const weekend = date.getDay() === 0 || date.getDay() === 6;
          const key = `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
          return `<div class="day-cell ${adjacent ? "is-adjacent" : ""} ${weekend ? "is-weekend" : ""} ${key === todayKey ? "is-today" : ""}" role="gridcell" aria-label="${new Intl.DateTimeFormat(locale, { dateStyle: "full" }).format(date)}">
            <span class="day-number">${date.getDate()}</span>
          </div>`;
        }).join("");
      });

      const todayLabel = new Intl.DateTimeFormat(locale, {
        month: "long",
        day: "numeric",
        weekday: "long"
      }).format(today);
      document.querySelectorAll("[data-today-label]").forEach(node => node.textContent = `今天 · ${todayLabel}`);
    }

    function updateSwitcher() {
      document.querySelector("[data-current-variant]").textContent = `${state.variant} · ${variants[state.variant]}`;
      document.querySelectorAll("[data-set-variant]").forEach(button => {
        button.classList.toggle("is-active", button.dataset.setVariant === state.variant);
      });
      document.body.dataset.variant = state.variant;
      document.body.dataset.motion = state.reduced ? "reduce" : String(state.motion);
      document.querySelectorAll("[data-motion-value]").forEach(button => {
        button.classList.toggle("is-active", !state.reduced && button.dataset.motionValue === String(state.motion));
      });
      document.querySelector("[data-toggle-reduced]").textContent = state.reduced ? "Motion: reduced" : "Reduced motion";
      document.querySelector("[data-toggle-empty]").textContent = state.empty ? "恢复常规空月" : "空月说明";
    }

    function render() {
      stage.innerHTML = renderShell();
      renderCalendar();
      updateSwitcher();
      requestAnimationFrame(() => stage.querySelector(".workbench")?.classList.remove("is-launching"));
    }

    function setVariant(next) {
      state.variant = next;
      state.route = "home";
      const url = new URL(location.href);
      url.searchParams.set("variant", next);
      history.replaceState({}, "", url);
      render();
    }

    function navigate(route) {
      if (state.route === route) return;
      const current = stage.querySelector("[data-route-view]");
      const finish = () => {
        state.route = route;
        render();
        const next = stage.querySelector("[data-route-view]");
        next?.classList.add("is-entering");
      };
      if (state.reduced) {
        finish();
      } else {
        current?.classList.add("is-leaving");
        setTimeout(finish, Math.min(115, Number(getComputedStyle(document.documentElement).getPropertyValue("--motion").replace("ms", "")) * .62));
      }
    }

    function animateMonthTo(nextMonth, direction) {
      if (state.reduced) {
        state.month = nextMonth;
        renderCalendar();
        return;
      }
      const grid = stage.querySelector("[data-calendar-grid]");
      if (!grid) return;
      grid.classList.add(direction > 0 ? "is-out-next" : "is-out-prev");
      const motion = Number(getComputedStyle(document.documentElement).getPropertyValue("--motion").replace("ms", "")) || 200;
      setTimeout(() => {
        state.month = nextMonth;
        renderCalendar();
        const nextGrid = stage.querySelector("[data-calendar-grid]");
        if (!nextGrid) return;
        nextGrid.classList.add(direction > 0 ? "is-out-prev" : "is-out-next");
        requestAnimationFrame(() => requestAnimationFrame(() => {
          nextGrid.classList.remove("is-out-prev", "is-out-next");
        }));
      }, Math.min(105, motion * .52));
    }

    function moveMonth(direction) {
      animateMonthTo(
        new Date(state.month.getFullYear(), state.month.getMonth() + direction, 1),
        direction
      );
    }

    function returnToday() {
      const today = new Date();
      const nextMonth = new Date(today.getFullYear(), today.getMonth(), 1);
      if (nextMonth.getTime() === state.month.getTime()) return;
      animateMonthTo(nextMonth, nextMonth < state.month ? -1 : 1);
    }

    function openQuick() {
      lab.hidden = true;
      quickOverlay.classList.add("is-open");
      quickOverlay.setAttribute("aria-hidden", "false");
      setTimeout(() => document.querySelector("#quick-search-input")?.focus(), state.reduced ? 0 : 80);
    }

    function closeQuick() {
      quickOverlay.classList.remove("is-open");
      quickOverlay.setAttribute("aria-hidden", "true");
    }

    function cycleVariant(direction) {
      const keys = Object.keys(variants);
      const nextIndex = (keys.indexOf(state.variant) + direction + keys.length) % keys.length;
      setVariant(keys[nextIndex]);
    }

    function updateReduced() {
      state.reduced = !state.reduced;
      const url = new URL(location.href);
      if (state.reduced) url.searchParams.set("motion", "reduce");
      else url.searchParams.delete("motion");
      history.replaceState({}, "", url);
      document.documentElement.style.setProperty("--motion", state.reduced ? "1ms" : `${state.motion}ms`);
      updateSwitcher();
    }

    document.addEventListener("click", event => {
      const routeButton = event.target.closest("[data-route]");
      if (routeButton) {
        if (state.variant === "C") {
          document.querySelectorAll(".vc-rail-chip").forEach(button => {
            button.classList.toggle("is-accent", button.dataset.route === routeButton.dataset.route);
          });
        }
        navigate(routeButton.dataset.route);
        return;
      }
      if (event.target.closest("[data-month-move]")) {
        moveMonth(Number(event.target.closest("[data-month-move]").dataset.monthMove));
        return;
      }
      if (event.target.closest("[data-month-today]")) {
        returnToday();
        return;
      }
      if (event.target.closest("[data-close-quick]")) {
        closeQuick();
        return;
      }
      if (event.target.closest("[data-cycle]")) {
        cycleVariant(Number(event.target.closest("[data-cycle]").dataset.cycle));
        return;
      }
      if (event.target.closest("[data-set-variant]")) {
        setVariant(event.target.closest("[data-set-variant]").dataset.setVariant);
        return;
      }
      if (event.target.closest("[data-toggle-lab]")) {
        lab.hidden = !lab.hidden;
        return;
      }
      if (event.target.closest("[data-toggle-reduced]")) {
        updateReduced();
        return;
      }
      if (event.target.closest("[data-toggle-empty]")) {
        state.empty = !state.empty;
        stage.querySelector(".calendar")?.classList.toggle("is-empty", state.empty);
        updateSwitcher();
        return;
      }
      if (event.target.closest("[data-toggle-quick]")) {
        openQuick();
      }
    });

    document.querySelectorAll("[data-motion-value]").forEach(button => {
      button.addEventListener("click", () => {
        const value = button.dataset.motionValue;
        state.motion = Number(value);
        state.reduced = false;
        document.documentElement.style.setProperty("--motion", `${value}ms`);
        const url = new URL(location.href);
        url.searchParams.delete("motion");
        history.replaceState({}, "", url);
        updateSwitcher();
      });
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && quickOverlay.classList.contains("is-open")) {
        event.preventDefault();
        closeQuick();
        return;
      }
      const target = event.target;
      if (["INPUT", "TEXTAREA"].includes(target.tagName) || target.isContentEditable) return;
      if (event.key === "ArrowLeft") cycleVariant(-1);
      if (event.key === "ArrowRight") cycleVariant(1);
    });

    quickOverlay.addEventListener("click", event => {
      if (event.target === quickOverlay) closeQuick();
    });

    document.documentElement.style.setProperty("--motion", state.reduced ? "1ms" : `${state.motion}ms`);
    render();
  </script>
</body>
</html>
